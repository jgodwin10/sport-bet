# Local development stack: frontend, API, worker, scheduler, PostgreSQL, Redis.
#   cp .env.example .env   # then edit secrets / API keys
#   docker compose up --build
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://footy:${POSTGRES_PASSWORD:-footy}@db:5432/footy
    REDIS_URL: redis://redis:6379/0
    TASK_MODE: celery
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-footy}
      POSTGRES_DB: footy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footy"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"]
      interval: 30s

  worker:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "--concurrency", "2"]

  scheduler:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
