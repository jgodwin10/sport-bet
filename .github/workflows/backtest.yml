# Walk-forward backtest of the tracked leagues, then deploy the resulting model version and
# re-run predictions so they use it. Run it by hand (Actions -> Backtest and deploy -> Run
# workflow) after a history backfill, at the start of a season, or when the model changes.
#
# A deployed version supplies the learned ensemble weights and the list of validated markets.
# Without one, every selection fails "market not validated by backtest", so the top picks can
# only ever be "watchlist". The version covers the competitions it was backtested on; cups have
# no historical odds to backtest against and stay unvalidated.
name: Backtest and deploy

on:
  workflow_dispatch:
    inputs:
      competitions:
        description: Competition codes separated by spaces, or "leagues" for every tracked league
        default: leagues
      date_from:
        description: First evaluated date (YYYY-MM-DD); empty = 1 July two years ago
        default: ""
      deploy:
        description: Deploy the new model version and refresh predictions
        type: boolean
        default: true

concurrency:
  group: scheduled-jobs  # shares the database with the scheduled jobs
  cancel-in-progress: false

env:
  ENVIRONMENT: production
  TASK_MODE: inline
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backtest
        env:
          COMPETITIONS_INPUT: ${{ inputs.competitions }}
          DATE_FROM: ${{ inputs.date_from }}
        run: |
          from="${DATE_FROM:-$(date -u -d '2 years ago' +%Y-07-01)}"
          python -m app.cli backtest --competitions $COMPETITIONS_INPUT --from "$from" --to "$(date -u +%F)" \
            ${{ inputs.deploy && '--deploy' || '' }}
      - name: Update predictions
        if: ${{ inputs.deploy }}
        run: python -m app.cli predict
